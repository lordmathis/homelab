server:
  port: 9001
instances:
  max_running_instances: 3
  group_limits:
    large: 1
    small: 2
  port_range: [8000, 8100]
auth:
  management_keys:
    - ${LLAMACTL_MGMT_KEY}
  oidc:
    issuer_url: ${AUTHELIA_DOMAIN}
    client_id: "llamactl"
    client_secret: ${OIDC_CLIENT_SECRET}
backends:
  mlx:
    command: "mlx_lm.server"
    args: []