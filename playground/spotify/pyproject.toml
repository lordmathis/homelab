[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-indexer"
version = "0.1.0"
description = "Spotify library semantic search: lyrics + metadata embedded into Qdrant"
requires-python = ">=3.13"
dependencies = [
    "spotipy>=2.26.0",
    "httpx>=0.28.0",
    "qdrant-client==1.17.1",
    "typer>=0.15.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
spotify-indexer = "spotify_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
